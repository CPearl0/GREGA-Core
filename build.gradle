plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel', 'src/generated/**/.cache')
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {}

    server {
        argument '--nogui'
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

// GTM embeds these API libraries in its published jar. Expose that exact set to javac.
configurations { gtBundle }
def gtLibraries = tasks.register('extractGTCompileLibraries', Sync) {
    from({ zipTree(configurations.gtBundle.singleFile) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('gt-compile-libraries')
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation 'maven.modrinth:gregtechceu-modern:iFPVZs0V'
    compileOnly 'maven.modrinth:ars-nouveau:ALmdjtiq'
    compileOnly 'maven.modrinth:fenns_totemic:tS54LAQx'
    gtBundle 'maven.modrinth:gregtechceu-modern:iFPVZs0V'
    compileOnly files(gtLibraries).asFileTree.matching { include '*.jar' }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE', 'TEMPLATE_LICENSE.txt', 'THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
